<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece8f6">
<title>Meu treino · Out/Nov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece8f6; --card:#ffffff; --ink:#17151c; --ink2:#5f5a6b; --ink3:#a29cae; --hair:rgba(23,21,28,.08);
  --lav:#c7b6f7; --lav2:#ae97f2; --orange:#f8b44c; --blue:#b7cbf7; --pink:#f6b2dc; --mint:#a9e4cf; --gray:#dcd6e8;
  --acc:#7c5cf0;
  --r:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(130px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.who{display:flex;align-items:center;gap:12px}
.ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ffcf8a,#f59bc8 55%,#a98bf5);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 0 0 3px #fff}
.hi{font-weight:800;font-size:17px;letter-spacing:-.01em}
.dt{font-size:13px;color:var(--ink2);font-weight:500;margin-top:1px}
.round{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 20px 20px;margin-bottom:18px;background:var(--lav)}
.hero.inf{background:#fbc979}.hero.sup{background:var(--blue)}.hero.full{background:var(--lav)}.hero.cardio{background:var(--pink)}.hero.rest{background:var(--gray)}
.hero h2{position:relative;z-index:2;font-size:34px;line-height:1.02;letter-spacing:-.04em;margin:12px 0 6px;font-weight:800;max-width:100%}
.hero .sub{position:relative;z-index:2;font-size:13.5px;font-weight:600;color:rgba(23,21,28,.72)}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;position:relative;z-index:2}
.pill.dark{background:var(--ink);color:#fff}
.hero .row2{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.hero .bar{position:relative;z-index:2;height:8px;border-radius:9px;background:rgba(255,255,255,.55);margin-top:16px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .4s}
.hero .prog{position:relative;z-index:2;font-size:12px;font-weight:700;margin-top:7px;color:rgba(23,21,28,.7)}
/* 3D-ish shapes */
.shapes{position:absolute;right:-18px;top:14px;width:170px;height:170px;z-index:1;pointer-events:none}
.shapes span{position:absolute;display:block}
.s1{width:92px;height:92px;border-radius:50%;right:22px;top:6px;background:radial-gradient(circle at 32% 28%,#fff 0,#ffd7a1 18%,#f39b5b 62%,#c9643a 100%);box-shadow:0 18px 24px -12px rgba(0,0,0,.35)}
.s2{width:74px;height:74px;border-radius:50%;right:96px;top:62px;background:radial-gradient(circle at 50% 50%,transparent 0 17px,#6b5bd6 18px 20px,#9d8cf5 21px 30px,#4b3cb8 33px,transparent 37px);filter:drop-shadow(0 12px 10px rgba(0,0,0,.25))}
.s3{width:46px;height:96px;border-radius:30px;right:16px;top:86px;transform:rotate(-28deg);background:linear-gradient(90deg,#3a3446,#5c556b 45%,#2a2533);box-shadow:0 14px 18px -8px rgba(0,0,0,.4)}
.s4{width:30px;height:30px;border-radius:50%;right:104px;top:8px;background:radial-gradient(circle at 35% 30%,#fff,#f6b2dc 45%,#d473ad);box-shadow:0 8px 10px -4px rgba(0,0,0,.25)}
.hero.sup .s1{background:radial-gradient(circle at 32% 28%,#fff 0,#d9e4ff 18%,#6f95f2 62%,#3c5fc4 100%)}
.hero.cardio .s1{background:radial-gradient(circle at 32% 28%,#fff 0,#ffd6ec 18%,#ef7fbe 62%,#b9488a 100%)}
.hero.rest .s1{background:radial-gradient(circle at 32% 28%,#fff 0,#e9e3f5 18%,#b3a8c9 62%,#7d7296 100%)}

/* week */
.whead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.whead b{font-size:15px;font-weight:800}
.whead .nav{display:flex;gap:6px}
.whead .nav button{width:32px;height:32px;border-radius:50%;background:#fff;font-size:18px;font-weight:700;color:var(--ink2);display:grid;place-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:24px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;border-radius:999px;background:#fff;position:relative;transition:transform .15s}
.day:active{transform:scale(.96)}
.day .dl{font-size:11px;font-weight:600;color:var(--ink3)}
.day .dn{font-size:17px;font-weight:800;line-height:1.1}
.day .tg{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:999px;margin-top:2px;min-width:20px;text-align:center}
.day.sel{background:var(--ink);color:#fff}
.day.today:not(.sel){box-shadow:inset 0 0 0 2px var(--ink)}
.day.today.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.day.sel .dl{color:rgba(255,255,255,.6)}

.day .ok{position:absolute;top:-3px;right:-2px;width:17px;height:17px;border-radius:50%;background:#2bbf7c;color:#fff;font-size:9px;display:grid;place-items:center;font-weight:800;border:2px solid var(--bg)}
.tg.inf{background:#fbd08a;color:#5a3a06}.tg.sup{background:#cddcfb;color:#1f3a86}.tg.full{background:#ddd0fb;color:#432b8c}.tg.cardio{background:#fbd0e9;color:#7c2357}.tg.rest{background:transparent;color:var(--ink3)}

/* section titles */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sec h3{margin:0;font-size:22px;letter-spacing:-.03em;font-weight:800}
.sec small{font-size:12.5px;color:var(--ink2);font-weight:600}
.note{font-size:13px;color:var(--ink2);margin:-4px 2px 12px;font-weight:500}

/* segmented + ou */
.seg{display:flex;background:#fff;border-radius:999px;padding:5px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:10px 0;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.ou{display:flex;align-items:center;gap:6px;background:#fff;border-radius:22px;padding:8px 8px 8px 16px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--ink2)}
.ou span{flex:1}
.ou button{padding:9px 15px;border-radius:999px;font-weight:800;background:var(--bg)}
.ou button.on{background:var(--ink);color:#fff}

/* starter tiles (like "Your plan") */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:26px;padding:16px 15px;display:flex;flex-direction:column;gap:8px;min-height:180px;position:relative}
.tile.t0{background:var(--orange)}.tile.t1{background:var(--blue)}
.tile h4{margin:2px 0 0;font-size:15px;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.tile p{margin:0;font-size:12.5px;line-height:1.4;color:rgba(23,21,28,.72);font-weight:500}
.tile .foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.tile .pill{font-size:11.5px;padding:5px 9px}
.tile .check{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.6);border-color:transparent}
.tile.done{opacity:.6}
.strip{display:flex;align-items:center;gap:10px;background:var(--pink);border-radius:22px;padding:12px 14px;margin-top:12px;font-size:13px;font-weight:700}
.strip i{font-style:normal;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}

/* exercise cards */
.ex{background:#fff;border-radius:26px;padding:16px;margin-bottom:12px;transition:opacity .25s}
.ex.done{opacity:.5}
.exh{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:40px;height:40px;border-radius:14px;background:var(--acc-bg,#fbd08a);color:var(--ink);font-weight:800;display:grid;place-items:center;font-size:16px}
.num.soft{background:var(--bg);font-size:12px;color:var(--ink2)}
.exh .t{flex:1;min-width:0}
.exh h3{margin:2px 0 0;font-size:15.5px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.opt{font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid rgba(23,21,28,.14);display:grid;place-items:center;color:transparent;transition:all .2s}
.ex.done .check,.tile.done .check{background:#2bbf7c;border-color:#2bbf7c;color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0 52px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--bg);color:var(--ink2)}
.chip.tap{background:var(--ink);color:#fff;cursor:pointer}
.chip.hy{background:#fde7f3;color:#8a2f63}
.rows{margin:12px 0 0 52px;display:flex;flex-direction:column;gap:6px}
.r{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 12px;border-radius:16px;background:#f6f4fb}
.r .s{flex:none;min-width:28px;font-size:11px;font-weight:800;color:var(--ink2)}
.r .tx{flex:1;font-size:13.5px;line-height:1.38}
.kg{flex:none;width:66px;display:flex;align-items:center;border-radius:12px;background:#fff;padding:0 8px;box-shadow:0 0 0 1px var(--hair)}
.kg input{width:100%;border:0;outline:0;background:none;font:inherit;font-size:15px;font-weight:800;padding:8px 0;text-align:right;color:var(--ink)}
.kg input::placeholder{color:#c6c0d0;font-weight:700}
.kg span{font-size:11px;color:var(--ink3);margin-left:2px;font-weight:600}
details{margin:10px 0 0 52px}
summary{font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ "}
details[open] summary::before{content:"– "}
details p{font-size:13.5px;line-height:1.55;color:var(--ink2);margin:8px 0 0}

.finish{width:100%;padding:18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;margin-top:8px}
.finish.green{background:#2bbf7c}

/* cardio */
.ctype{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctype button{padding:15px 0;font-weight:700;border-radius:20px;background:#fff}
.ctype button.on{background:var(--ink);color:#fff}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;background:#fff;border-radius:26px}
.cform label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink2)}
.cform .wide{grid-column:1/-1}
.cform input,.cform select{font:inherit;font-size:16px;font-weight:700;padding:12px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);width:100%;outline:0}

/* rest */
.plain{background:#fff;border-radius:26px;padding:20px;font-size:14px;color:var(--ink2);line-height:1.5;font-weight:500}

/* fichas */
.fichas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtn{border-radius:22px;padding:14px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:4px}
.fbtn b{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.fbtn b i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fbtn span{font-size:12px;color:var(--ink2);font-weight:600;line-height:1.3}
.fbtn.on{box-shadow:inset 0 0 0 2px var(--ink)}
.hist{background:#fff;border-radius:22px;padding:4px 16px}
.hist div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--hair);font-size:13.5px;font-weight:600}
.hist div:last-child{border:0}
.hist div span:last-child{color:var(--ink2);font-weight:500}

/* bottom nav */
.tab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:6px;padding:7px;border-radius:999px;background:var(--ink);box-shadow:0 18px 40px -14px rgba(0,0,0,.55)}
.tab button{width:58px;height:50px;border-radius:999px;display:grid;place-items:center;color:rgba(255,255,255,.75)}
.tab button.on{background:#fff;color:var(--ink)}

/* timer */
.timer{position:fixed;left:50%;transform:translate(-50%,30px);opacity:0;pointer-events:none;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 18px;border-radius:999px;background:#fff;transition:all .3s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 14px 34px -12px rgba(40,20,80,.4)}
.timer.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.timer .tt{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:62px}
.timer .lbl{font-size:11px;color:var(--ink3);font-weight:700}
.timer button{background:var(--bg);border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800}
.timer.end{background:#2bbf7c;color:#fff}
.timer.end button{background:rgba(255,255,255,.25);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,15,30,.3);z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:520px;margin:0 auto;padding:22px 20px calc(24px + env(safe-area-inset-bottom));border-radius:30px 30px 0 0;background:#fff;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sheet.show{transform:none}
.sheet h3{margin:0 0 4px;font-size:22px;letter-spacing:-.03em;font-weight:800}
.sheet .hint{font-size:13px;color:var(--ink2);margin:0 0 12px;font-weight:500}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair)}
.srow label{font-weight:700;font-size:14px}
.srow select{font:inherit;font-weight:700;font-size:14px;padding:10px 12px;border-radius:14px;border:0;background:var(--bg);max-width:64%}
.cdays{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.cdays button{padding:8px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--bg)}
.cdays button.on{background:var(--ink);color:#fff}
.sheet .done{margin-top:16px;width:100%;padding:16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);z-index:12;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tab" id="tab">
  <button data-tab="hoje" class="on" aria-label="Hoje"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button data-tab="fichas" aria-label="Fichas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
  <button data-tab="timer" aria-label="Cronômetro"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></button>
  <button data-tab="ajustes" aria-label="Minha semana"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</nav>
<div class="timer" id="timer"><div><div class="lbl">descanso</div><div class="tt" id="tt">0:00</div></div><button id="tplus">+15s</button><button id="tstop">ok</button></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>

const DATA = {"completo": {"A": [{"k": "ativacao", "n": null, "name": "Retrocesso alternado com halter a frente + agachamento taça (calcanhar na anilha) com halter a frente", "sets": 2, "extra": "", "spec": [{"s": "1ª e 2ª", "t": "10/10 retrocesso + 10 agachamento taça com pausa de 1 seg embaixo"}], "rest": "45 seg", "hyb": null, "opt": null, "how": ""}, {"k": "aquecimento", "n": null, "name": "Leg press 45 ou horizontal", "sets": 1, "extra": "", "spec": [], "rest": "1 min", "hyb": null, "opt": null, "how": ""}, {"k": "main", "n": 1, "name": "Leg press 45 ou horizontal + agachamento unipodal com halteres nas mãos ou ombro", "sets": 3, "extra": "", "spec": [{"s": "1ª", "t": "10 a 12 descendo em 2-3 seg + 12/12 cada lado unipodal"}, {"s": "2ª", "t": "8 a 10 descendo em 2-3 seg + 12/12 cada lado unipodal"}, {"s": "3ª", "t": "6 a 8 descendo em 2-3 seg + 12/12 cada lado unipodal"}], "rest": "1:10 - 1:20 min", "hyb": null, "opt": null, "how": "exercício conjugado, ou seja, você começará o exercício realizando o leg press e, sem descanso, continuará realizando o agachamento unipodal com halteres nas mãos ou no ombro (com cada perna). A cada série, você fará um ajuste (aumento) de carga no leg (10 a 12 na 1ª série, 8 a 10 na 2ª série e 6 a 8 na 3ª série), sempre descendo de forma controlada em 2-3 segundos. No agachamento unipodal, você manterá 12 repetições com cada lado em todas as séries. 1ª série: 10 a 12 descendo em 2-3 seg + 12/12 cada lado unipodal: com uma carga média-alta, comece realizando entre 10 a 12 repetições do leg press, descendo controlando o movimento em 2-3 segundos. Sem descanso, vá direto para o agachamento unipodal com halteres nas mãos ou ombro e realize 12 repetições com uma perna e 12 repetições com a outra perna. Descanse 1:10 - 1:20 min."}, {"k": "main", "n": 2, "name": "Goblet squat com halteres na frente", "sets": 4, "extra": "", "spec": [{"s": "1ª", "t": "12 com pausa embaixo, descendo em 2 seg"}, {"s": "2ª", "t": "10 com pausa embaixo, descendo em 2 seg"}, {"s": "3ª", "t": "8 com pausa embaixo, descendo em 2 seg - descansa 20 seg - 8 a 10 diretas"}, {"s": "4ª", "t": "8 com pausa embaixo, descendo em 2 seg - reduz 20% do peso - 10 a 12 diretas ou falha"}], "rest": "1:10 - 1:30 min", "hyb": null, "opt": null, "how": "A cada série, você fará um aumento de carga. Nas 1ª e 2ª séries, você trabalhará com controle na descida e pausa embaixo. Na 3ª série, após as repetições com pausa, você descansará brevemente e continuará com repetições diretas (método rest pause). Na última série, você reduzirá 20% do peso e irá direto para as repetições diretas buscando a falha muscular (método drop set)."}, {"k": "main", "n": 3, "name": "Afundo com base parada com halteres (step frente) + afundo parcial sem peso (step frente)", "sets": 3, "extra": "", "spec": [{"s": "1ª", "t": "10 a 12 com pausa de 1 seg embaixo + 12 parciais sem peso mesma perna"}, {"s": "2ª", "t": "10 a 12 com pausa de 1 seg embaixo + 15 parciais sem peso mesma perna"}, {"s": "3ª", "t": "10 a 12 com pausa de 1 seg embaixo + 20 parciais sem peso mesma perna"}], "rest": "40-50 seg entre as pernas", "hyb": null, "opt": null, "how": "exercício conjugado, ou seja, você começará o exercício realizando o afundo com base parada com halteres com o pé da frente no step e, sem descanso, continuará realizando o afundo parcial sem peso com a mesma perna. Em todas as séries, mantenha o peso no afundo e sempre aumente as repetições do afundo parcial sem peso. Após finalizar uma perna completa, você repetirá exatamente o mesmo com a outra perna."}, {"k": "main", "n": 4, "name": "Passada com halteres nas mãos", "sets": 4, "extra": "", "spec": [{"s": "1ª", "t": "12 ida + 12 volta"}, {"s": "2ª", "t": "10 ida + 10 volta"}, {"s": "3ª", "t": "8 ida + 8 volta"}, {"s": "4ª", "t": "6 ida + 6 volta - reduz o peso - 6 ida + 6 volta"}], "rest": "1:10 - 1:20 min", "hyb": null, "opt": null, "how": "A cada série, você fará um aumento de carga para respeitar as zonas de repetições pedidas. A cada série, tente aumentar o peso a medida que o número de repetições reduz a cada série. Na última série, após as repetições pesadas, você reduzirá o peso e realizará mais uma rodada de ida e volta para chegar a falha muscular. 1ª série: 12 ida + 12 volta: com uma carga média, realize 12 passadas de ida e 12 passadas de volta com os halteres nas mãos (controle o movimento em todas as repetições). Descanse 1:10 - 1:20 min. 2ª série: 10 ida + 10 volta: aumente a carga e realize 10 passadas de ida e 10 passadas de volta. Descanse 1:10 - 1:20 min. 3ª série: 8 ida + 8 volta: aumente a carga e realize 8 passadas de ida e 8 passadas de volta. Descanse 1:10 - 1:20 min. 4ª série: 6 ida + 6 volta - reduz o peso - 6 ida + 6 volta: aumente a carga para se aproximar de 6 repetições máximas e realize 6 passadas de ida e 6 passadas de volta. Sem descanso, reduza o peso e realize mais 6 passadas de ida e 6 passadas de volta (chegando na falha). Descanse 1:10 - 1:20 min."}, {"k": "main", "n": 5, "name": "Cadeira extensora + salto curtinho sem peso", "sets": 4, "extra": "Regressivas", "spec": [{"s": "1ª", "t": "18 cadeira extensora + 18 saltinhos sem peso - descansa 1 min"}, {"s": "2ª", "t": "16 cadeira extensora + 16 saltinhos sem peso - descansa 40 seg"}, {"s": "3ª", "t": "14 cadeira extensora + 14 saltinhos sem peso - descansa 30 seg"}, {"s": "4ª", "t": "12 cadeira extensora + 12 saltinhos sem peso"}], "rest": "1 min", "hyb": null, "opt": null, "how": "exercício conjugado, ou seja, você começará realizando a cadeira extensora e, sem descanso, continuará realizando os saltinhos curtinhos sem peso. As séries são regressivas, ou seja, as repetições irão reduzir a cada série. A ideia é manter o movimento contínuo e dinâmico, mantendo o mesmo padrão de execução em todas as séries. Após finalizar os agachamentos, passe imediatamente para os saltinhos curtinhos sem peso. 1ª série: 18 cadeira extensora + 18 saltinhos sem peso: com uma carga média, comece realizando 18 repetições da cadeira extensora. Assim que finalizar, sem descanso, realize 18 saltinhos curtinhos sem peso. Descanse 1 minuto. 2ª série: 16 cadeira extensora + 16 saltinhos sem peso: mantenha a carga e volte a realizar 16 repetições da cadeira extensora. Assim que finalizar, sem descanso, realize 16 saltinhos curtinhos sem peso. Descanse 40 segundos. 3ª série: 14 cadeira extensora + 14 saltinhos sem peso: mantenha a carga e volte a realizar 14 repetições da cadeira extensora. Assim que finalizar, sem descanso, realize 14 saltinhos curtinhos sem peso. Descanse 30 segundos."}, {"k": "main", "n": 6, "name": "Cadeira adutora + panturrilha no smith com step embaixo ou na máquina de panturrilha ou no leg", "sets": 3, "extra": "", "spec": [{"s": "1ª e 2ª", "t": "12 a 15 adutora + 15 a 20 com 1 seg em cima panturrilha"}, {"s": "3ª", "t": "12 a 15 adutora + 10 a 12 completas + 10 parciais do meio pra cima + 10 parciais de baixo para o meio panturrilha"}], "rest": "40 seg (1ª e 2ª) · 1 min (3ª)", "hyb": null, "opt": null, "how": ""}], "B1": [{"k": "ativacao", "n": null, "name": "Elevação frontal com tronco totalmente inclinado (peso leve) + crucifixo inverso com tronco totalmente inclinado (peso leve)", "sets": 2, "extra": "", "spec": [{"s": "1ª e 2ª", "t": "10 elevação frontal + 10 crucifixo inverso, peso leve"}], "rest": "30 seg", "hyb": null, "opt": null, "how": ""}, {"k": "aquecimento", "n": null, "name": "Elevação lateral com halteres em pé (peso leve)", "sets": 1, "extra": "", "spec": [{"s": "1ª", "t": "8 a 10 com carga bem leve"}], "rest": "1 min", "hyb": null, "opt": null, "how": ""}, {"k": "main", "n": 1, "name": "Elevação lateral com halteres em pé", "sets": 5, "extra": "", "spec": [{"s": "1ª e 2ª", "t": "8 a 12 pesadas, progredindo"}, {"s": "3ª", "t": "Cluster 4-4-4-4 pesadas"}, {"s": "4ª", "t": "Reduz 30% do peso - 12 a 15 com 2 seg em cima"}, {"s": "5ª", "t": "Método 3/7"}], "rest": "1:10 - 1:30 min", "hyb": 5, "opt": null, "how": "A cada série, você fará um ajuste (aumento) de carga para respeitar as zonas de repetições pedidas em cada série. Nas 1ª e 2ª séries, você trabalhará com cargas pesadas buscando entre 8 a 12 repetições. Na 3ª série, você fará o método cluster set (4 blocos de 4 repetições) com a mesma carga pesada. Na 4ª série, você fará uma redução de 30% do peso e executará repetições controladas com 2 segundos de isometria em cima. Na 5ª série, você finalizará com o método 3/7. 1ª série: 8 a 12 pesadas: com uma carga pesada (carga que você consiga fazer pelo menos 8 repetições e não faça mais que 12), comece realizando entre 8 a 12 repetições da elevação lateral com halteres em pé, subindo até a linha do ombro e descendo de forma controlada sem perder a tensão. Descanse 1:10 - 1:30 min."}, {"k": "main", "n": 2, "name": "Desenvolvimento fechado com pegada supinada e braços a frente com barra + around the world (peso mais leve)", "sets": 3, "extra": "", "spec": [{"s": "1ª e 2ª", "t": "10 a 12 desenvolvimento + 12 totais around the world"}, {"s": "3ª", "t": "10 a 12 com pausa em cima - reduz o peso - 10 diretas desenvolvimento + 12 totais around the world"}], "rest": "1 min - 1:10 min", "hyb": 10, "opt": null, "how": "exercício conjugado, ou seja, você começará o exercício realizando o desenvolvimento fechado com pegada supinada com barra e, sem descanso, continuará realizando o around the world com um peso mais leve. A cada série, mantenha um peso alto para 10 a 12 repetições no desenvolvimento e mantenha uma carga moderada para realizar o around the world. Apenas na última série, você fará o método drop set no desenvolvimento. 1ª e 2ª série: 10 a 12 desenvolvimento fechado + 12 totais around the world: com uma carga alta, comece realizando entre 10 a 12 repetições do desenvolvimento fechado com barra pegada supinada e, a cada repetição, faça de forma controlada. Sem descanso, reduza o peso para um halter mais leve e faça 12 repetições totais do around the world de forma contínua e controlada. Descanse 1 min - 1:10 min. 3ª série: drop set desenvolvimento fechado: aumente um pouco mais a carga e realize entre 10 a 12 repetições do desenvolvimento fechado com barra pegada supinada (com controle). Sem descanso, reduza o peso e faça mais 10 repetições diretas. Em seguida, reduza novamente para um halter mais leve e finalize com 12 repetições totais do around the world de forma contínua e controlada. Descanse 1 min - 1:10 min."}, {"k": "main", "n": 3, "name": "Elevação lateral unilateral com halter no banco 30º (deitada de lado)", "sets": 3, "extra": "", "spec": [{"s": "1ª e 2ª", "t": "12 a 15 com 1 seg embaixo + 1 seg em cima"}, {"s": "3ª", "t": "10 a 12 controladas descansa 20 seg - 8 a 10 diretas - descansa 20 seg - máximo direto parcial"}], "rest": "30-40 seg", "hyb": 5, "opt": null, "how": "Esse exercício será realizado de forma unilateral, deitada de lado em um banco inclinado a 30º. A cada série, você fará um ajuste de carga para manter a execução controlada. Nas duas primeiras séries, serão aplicados tempos específicos de isometria tanto na parte inferior (alongamento) quanto no topo do movimento. Na última série, você buscará a fadiga muscular. 1ª e 2ª série: 12 a 15 com 1 seg embaixo + 1 seg em cima: com um halter leve-médio, deite de lado no banco inclinado e realize entre 12 a 15 repetições. Em cada repetição, faça uma pausa de 1 segundo na parte mais baixa do movimento (antes de iniciar a subida) e mais 1 segundo no topo da elevação (pico de contração). Sem descanso, repita igual com o outro braço. Descanse 30-40 seg. 3ª série: fadiga: com um halter médio, inicie realizando entre 10 a 12 repetições com foco no controle do movimento, sem pausas. Descanse apenas 20 segundos e volte com o mesmo braço realizando de 8 a 10 repetições diretas. Descanse mais 20 segundos e finalize com o máximo de repetições parciais (subindo apenas até a metade do movimento). Repita a mesma sequência no outro braço. Descanse 1 minuto entre os lados."}, {"k": "main", "n": 4, "name": "Elevação frontal  qgp:{n:"Quadríceps, glúteo e posterior",w:[["D","B3","C1","A"],["A","B3","D","A"],["D","B3","C2","D"],["A","B3","D","C1"],["D","B3","C2","A"],["A","B3","D","C1"]]},
 gp:{n:"Glúteo e posterior",w:[["C1","B3","C2","C1"],["C2","B3","C1","C2"],["C1","B3","C2","C1"],["C2","B3","C1","C2"],["C1","B3","C2","C1"],["C2","B3","D","C1"]]},
 qg:{n:"Quadríceps e glúteo",w:[["A","B3","C1","A"],["C1","B3","A","C2"],["A","B3","D|C1","A"],["C1","B3","A","C1"],["A","B3","C1","A|D"],["C1","B3","A","D"]]},
 qp:{n:"Quadríceps e posterior",w:[["A","B3","C2","A"],["C2","B3","A","C1"],["A","B3","C2","A"],["C2","B3","A","C1"],["C2","B3","A","C2"],["A","B3","C2","A"]]}
};
const CARDIO_TYPES=["Esteira","Escada","Bike","Corrida","Elíptico","Outro"];
/* storage (safe) */
const KEY="treino-vf-v2";
let S={focus:"qgp",slots:[1,2,4,6],cardioDays:[3,5],pick:{},cardio:{},mode:"completo",loads:{},last:{},done:{},checks:{},hist:[]};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const today=new Date(); today.setHours(0,0,0,0);
let selDate=new Date(today);
let preview=null; // ficha opened from "outras fichas"
let weekOff=0;

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekDates(){const m=mondayOf(today);m.setDate(m.getDate()+7*weekOff);return [...Array(7)].map((_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return x})}
function cycleWeek(d){return Math.round((mondayOf(d)-CYCLE_START)/(7*864e5))}
function options(d){
  const slot=S.slots.indexOf(d.getDay());
  if(slot<0) return null;
  const w=Math.min(5,Math.max(0,cycleWeek(d)));
  return AGENDA[S.focus].w[w][slot].split("|");
}
function planFor(d){
  const o=options(d);
  if(o){const p=S.pick[iso(d)];return o.includes(p)?p:o[0]}
  if(S.cardioDays.includes(d.getDay())) return "CARDIO";
  return "OFF";
}
function groupOf(p){return FICHAS[p]?FICHAS[p].g:(p==="CARDIO"?"cardio":"rest")}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function parseRest(r){
  if(!r) return null;
  let m=r.match(/(\d+):(\d{2})/), n=r.match(/(\d+)\s*(?:-\s*\d+)?\s*(seg|min)?/);
  if(m && (!n || r.indexOf(m[0])<=r.indexOf(n[0]))) return (+m[1])*60+(+m[2]);
  if(n){let v=+n[1]; if(n[2]==="seg") return v; if(n[2]==="min"||v<5) return v*60; return v;}
  return null;
}

const GTAG={inf:"inf",sup:"sup",full:"full",cardio:"cardio",rest:"rest"};
const ACCBG={inf:"#fbd08a",sup:"#cddcfb",full:"#ddd0fb",cardio:"#fbd0e9",rest:"#e6e1ef"};
const short=p=>p.replace("C1","C.1").replace("C2","C.2");
function dayName(d){return d.toLocaleDateString("pt-BR",{weekday:"long"}).replace("-feira","")}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function render(){
  const app=document.getElementById("app");
  const plan=preview||planFor(selDate);
  const g=groupOf(plan);
  document.documentElement.style.setProperty("--acc-bg",ACCBG[g]);
  const wk=Math.min(5,Math.max(1,cycleWeek(selDate)+1));
  const ds=cap(today.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"}).replace("-feira","").replace(".",""));
  let h=`<div class="top"><div class="who"><div class="ava">V</div><div><div class="hi">Oi! Bora treinar?</div><div class="dt">${esc(ds)}</div></div></div>
    <button class="round" data-tab="ajustes" aria-label="Minha semana"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div>`;
  h+=heroView(plan,g,wk);
  const wd=weekDates();
  const wlab=weekOff===0?"Esta semana":wd[0].toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" a "+wd[6].toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  h+=`<div class="whead"><b>${wlab}</b><div class="nav"><button data-wk="-1" aria-label="semana anterior">‹</button><button data-wk="1" aria-label="próxima semana">›</button></div></div><div class="week">`+wd.map(d=>{
    const p=planFor(d),gg=groupOf(p),lab=FICHAS[p]?short(p):(p==="CARDIO"?"♥":"off");
    const cls=["day",iso(d)===iso(selDate)&&!preview?"sel":"",iso(d)===iso(today)?"today":""].join(" ");
    return `<button class="${cls}" data-d="${iso(d)}"><span class="dl">${DAYS[d.getDay()]}</span><span class="dn">${d.getDate()}</span><span class="tg ${gg}">${lab}</span>${S.done[iso(d)]?'<span class="ok">✓</span>':""}</button>`}).join("")+`</div>`;
  if(FICHAS[plan]) h+=fichaView(plan);
  else if(plan==="CARDIO") h+=cardioView();
  else h+=`<div class="plain">Off, yoga ou alongamento. Recuperar também faz parte do treino.</div>`;
  if(preview) h+=`<button class="finish" id="back">Voltar pro dia</button>`;
  else if(plan!=="OFF"){const isDone=!!S.done[iso(selDate)];h+=`<button id="finish" class="finish ${isDone?"green":""}">${isDone?"Feito ✓ · toque pra desmarcar":(plan==="CARDIO"?"Marcar cardio como feito":"Concluir treino")}</button>`}
  h+=`<div class="sec" id="fichas"><h3>Todas as fichas</h3><small>toque pra abrir</small></div><div class="fichas">`+Object.keys(FICHAS).map(k=>`<button class="fbtn ${preview===k?"on":""}" data-f="${k}"><b><i style="background:${ACCBG[FICHAS[k].g]}"></i>${short(k)}</b><span>${esc(FICHAS[k].s.split(" + ")[0])}</span></button>`).join("")+`</div>`;
  if(S.hist.length){h+=`<div class="sec"><h3>Histórico</h3></div><div class="hist">`+S.hist.slice(-6).reverse().map(x=>`<div><span>${esc(x.d.split("-").reverse().slice(0,2).join("/"))} · ${esc(FICHAS[x.f]?FICHAS[x.f].t:"Cardio")}</span><span>${x.f==="CARDIO"?((S.cardio[x.d]||{}).min?S.cardio[x.d].min+" min":""):(x.m==="reduzido"?"reduzido":"completo")}</span></div>`).join("")+`</div>`}
  app.innerHTML=h;
  bind();
}
function heroView(plan,g,wk){
  const shapes="";
  const when=preview?"Ficha":cap(dayName(selDate));
  let top=`<span class="pill dark">Semana ${wk} de 5</span>`;
  if(FICHAS[plan]){
    const main=(DATA[S.mode][plan]||[]).filter(x=>x.k==="main");
    const ck=S.checks[S.mode+"|"+plan]||{}, n=main.filter((_,i)=>ck["m"+i]).length;
    return `<div class="hero ${g}">${shapes}${top}<h2>${esc(FICHAS[plan].t)}</h2><div class="sub">${esc(when)} · ${esc(FICHAS[plan].s)}</div>
      <div class="row2"><span class="pill">${main.length} exercícios</span><span class="pill">${main.reduce((a,x)=>a+x.sets,0)} séries</span></div>
      <div class="bar"><i style="width:${main.length?n/main.length*100:0}%"></i></div><div class="prog">${n} de ${main.length} feitos</div></div>`;
  }
  if(plan==="CARDIO") return `<div class="hero cardio">${shapes}${top}<h2>Dia de cardio</h2><div class="sub">${esc(cap(dayName(selDate)))} · anota o que fez</div></div>`;
  return `<div class="hero rest">${shapes}${top}<h2>Descanso</h2><div class="sub">${esc(cap(dayName(selDate)))} · yoga ou alongamento</div></div>`;
}
function cardioView(){
  const k=iso(selDate),c=S.cardio[k]||{};
  const past=Object.entries(S.cardio).filter(([d,v])=>v.min&&d!==k).sort().slice(-4).reverse();
  return `<div class="sec"><h3>Seu cardio</h3></div><div class="ctype">${CARDIO_TYPES.map(t=>`<button class="${c.tipo===t?"on":""}" data-ct="${t}">${t}</button>`).join("")}</div>
  <div class="cform" style="margin-top:12px">
    <label><span>Minutos</span><input inputmode="numeric" data-cf="min" value="${esc(c.min||"")}" placeholder="30"></label>
    <label><span>Intensidade</span><select data-cf="int">${["","Leve","Moderado","Intenso","Intervalado"].map(o=>`<option value="${o}" ${c.int===o?"selected":""}>${o||"Escolher"}</option>`).join("")}</select></label>
    <label class="wide"><span>Observação</span><input data-cf="obs" value="${esc(c.obs||"")}" placeholder="ex.: inclinação 8, velocidade 6"></label>
  </div>
  ${past.length?`<div class="sec"><h3>Últimos cardios</h3></div><div class="hist">${past.map(([d,v])=>`<div><span>${d.split("-").reverse().slice(0,2).join("/")} · ${esc(v.tipo||"Cardio")}</span><span>${esc(v.min)} min${v.int?" · "+esc(v.int.toLowerCase()):""}</span></div>`).join("")}</div>`:""}<div style="height:16px"></div>`;
}
function fichaView(f){
  const items=DATA[S.mode][f]||[];
  const pre=items.filter(x=>x.k==="ativacao"||x.k==="aquecimento");
  const main=items.filter(x=>x.k==="main");
  const end=items.filter(x=>!["ativacao","aquecimento","main"].includes(x.k));
  const ck=S.checks[S.mode+"|"+f]||{};
  let h=`<div class="seg">${["completo","reduzido"].map(m=>`<button data-mode="${m}" class="${S.mode===m?"on":""}">${m==="completo"?"Completo":"Reduzido"}</button>`).join("")}</div>`;
  const op=!preview&&options(selDate);
  if(op&&op.length>1) h+=`<div class="ou"><span>Hoje a agenda deixa escolher</span>${op.map(o=>`<button data-pick="${o}" class="${o===f?"on":""}">${short(o)}</button>`).join("")}</div>`;
  if(pre.length){
    h+=`<div class="sec"><h3>Começo</h3><small>antes: alongamento ${FICHAS[f].g==="sup"?"superiores":"inferiores"}</small></div><div class="tiles">`+pre.map((x,i)=>tile(x,"p"+i,i,ck)).join("")+`</div>`;
  }
  h+=`<div class="sec"><h3>Seu treino</h3><small>${S.mode==="reduzido"?"versão reduzida":"versão completa"}</small></div>`;
  main.forEach((x,i)=>h+=card(f,x,"m"+i,ck));
  if(end.length){
    h+=`<div class="sec"><h3>Final</h3></div>`;
    if(end.some(x=>x.k==="opcao")) h+=`<div class="note">Escolha só uma das opções, de acordo com seu foco.</div>`;
    end.forEach((x,i)=>h+=card(f,x,"e"+i,ck));
  }
  return h;
}
const KLAB={ativacao:"Ativação",aquecimento:"Aquecimento",abdomen:"Abdômen",exaustao:"Se tiver tempo",opcao:"Opção",extra:"Extra"};
function tile(x,id,i,ck){
  const rs=parseRest(x.rest);
  const txt=x.spec.length?x.spec.map(s=>s.t).join(" · "):(x.k==="aquecimento"?"8 a 10 repetições com carga bem leve, só pra aquecer":"");
  return `<div class="tile t${i%2} ${ck[id]?"done":""}"><button class="check" data-ck="${id}" aria-label="feito"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></button>
    <span class="pill" style="align-self:flex-start">${KLAB[x.k]}</span><h4>${esc(x.name)}</h4>${txt?`<p>${esc(txt)}</p>`:""}
    <div class="foot"><span class="pill">${x.sets}x</span>${x.rest?`<span class="pill" ${rs?`data-rest="${rs}" style="cursor:pointer"`:""}>⏱ ${esc(x.rest)}</span>`:""}</div></div>`;
}
function card(f,x,id,ck){
  const key=S.mode+"|"+f+"|"+id;
  const badge=x.n?`<div class="num">${x.n}</div>`:`<div class="num soft">${x.k==="abdomen"?"abs":"+"}</div>`;
  const label=x.n?"":`<div class="opt">${esc(x.opt||KLAB[x.k]||"")}</div>`;
  const rs=parseRest(x.rest);
  let h=`<div class="ex ${ck[id]?"done":""}"><div class="exh">${badge}<div class="t">${label}<h3>${esc(x.name)}</h3></div><button class="check" data-ck="${id}" aria-label="feito"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></button></div>`;
  h+=`<div class="meta"><span class="chip">${x.sets} ${x.sets>1?"séries":"série"}</span>${x.rest?`<span class="chip ${rs?"tap":""}" ${rs?`data-rest="${rs}"`:""}>⏱ ${esc(x.rest)}</span>`:""}${x.hyb?`<span class="chip hy">+${x.hyb} min corrida/escada (opcional)</span>`:""}</div>`;
  if(x.spec.length){
    h+=`<div class="rows">`+x.spec.map((s,i)=>{
      const lk=key+"|"+i, last=S.last[lk], cur=S.loads[lk]??"";
      return `<div class="r"><span class="s">${esc(s.s||"•")}</span><span class="tx">${esc(s.t)}</span><label class="kg"><input inputmode="decimal" data-lk="${lk}" value="${esc(cur)}" placeholder="${last!=null&&last!==""?esc(last):"–"}"><span>kg</span></label></div>`}).join("")+`</div>`;
  }
  if(x.how) h+=`<details><summary>Como fazer</summary><p>${esc(x.how)}</p></details>`;
  return h+`</div>`;
}

/* timer */
let tInt=null,tLeft=0,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.18,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.18);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  tLeft=sec;const el=document.getElementById("timer");el.classList.add("show");el.classList.remove("end");tick();clearInterval(tInt);
  tInt=setInterval(()=>{tLeft--;tick();if(tLeft<=0){clearInterval(tInt);el.classList.add("end");document.getElementById("tt").textContent="bora!";beep()}},1000)}
function tick(){const m=Math.floor(Math.max(0,tLeft)/60),s=Math.max(0,tLeft)%60;document.getElementById("tt").textContent=m+":"+String(s).padStart(2,"0")}
document.getElementById("tplus").onclick=()=>{tLeft+=15;if(document.getElementById("timer").classList.contains("end"))startTimer(tLeft);tick()};
document.getElementById("tstop").onclick=()=>{clearInterval(tInt);document.getElementById("timer").classList.remove("show")};

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}

function bind(){
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const [y,m,d]=b.dataset.d.split("-");selDate=new Date(+y,m-1,+d);preview=null;render();window.scrollTo({top:0,behavior:"smooth"})});
  document.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{weekOff+=+b.dataset.wk;const wd=weekDates();selDate=weekOff===0?new Date(today):wd[0];preview=null;render()});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.pick[iso(selDate)]=b.dataset.pick;save();render()});
  document.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{const k=iso(selDate);S.cardio[k]=S.cardio[k]||{};S.cardio[k].tipo=b.dataset.ct;save();render()});
  document.querySelectorAll("[data-cf]").forEach(i=>i.oninput=i.onchange=()=>{const k=iso(selDate);S.cardio[k]=S.cardio[k]||{};S.cardio[k][i.dataset.cf]=i.value;save()});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();render()});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{preview=b.dataset.f;render();window.scrollTo({top:0,behavior:"smooth"})});
  document.querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>startTimer(+b.dataset.rest));
  document.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{const f=preview||planFor(selDate),k=S.mode+"|"+f;S.checks[k]=S.checks[k]||{};S.checks[k][b.dataset.ck]=!S.checks[k][b.dataset.ck];save();render()});
  document.querySelectorAll("[data-lk]").forEach(i=>i.oninput=()=>{S.loads[i.dataset.lk]=i.value.replace(",",".");save()});
  const fin=document.getElementById("finish");
  if(fin) fin.onclick=()=>{
    const dk=iso(selDate),plan=planFor(selDate);
    if(S.done[dk]){delete S.done[dk];save();render();return}
    S.done[dk]=true;
    if(FICHAS[plan]){
      const pref=S.mode+"|"+plan+"|";
      Object.keys(S.loads).filter(k=>k.startsWith(pref)).forEach(k=>{if(S.loads[k]!==""){S.last[k]=S.loads[k]}delete S.loads[k]});
      delete S.checks[S.mode+"|"+plan];
      S.hist.push({d:dk,f:plan,m:S.mode});S.hist=S.hist.slice(-40);
      toast("Treino salvo. Cargas guardadas pra próxima 💪");
    } else {S.hist.push({d:dk,f:"CARDIO",m:""});toast("Cardio registrado ♥")}
    save();render();
  };
  const back=document.getElementById("back"); if(back) back.onclick=()=>{preview=null;render()};
  document.querySelectorAll(".top [data-tab]").forEach(b=>b.onclick=openSheet);
}

function openSheet(){setTab("ajustes");
  const sh=document.getElementById("sheet");
  const dsel=(v,i)=>`<select data-slot="${i}">${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${v===d?"selected":""}>${DAYS[d]}</option>`).join("")}</select>`;
  sh.innerHTML=`<h3>Minha semana</h3><p class="hint">Agenda de 4x da consultoria. Fica salvo neste aparelho.</p>
  <div class="srow"><label>Foco</label><select id="focus">${Object.entries(AGENDA).map(([k,v])=>`<option value="${k}" ${S.focus===k?"selected":""}>${v.n}</option>`).join("")}</select></div>
  ${S.slots.map((d,i)=>`<div class="srow"><label>${i+1}º treino</label>${dsel(d,i)}</div>`).join("")}
  <div class="srow"><label>Cardio</label><div class="cdays">${[1,2,3,4,5,6,0].map(d=>`<button data-cd="${d}" class="${S.cardioDays.includes(d)?"on":""}">${DAYS[d]}</button>`).join("")}</div></div>
  <button class="done" id="closeSet">Pronto</button>`;
  sh.querySelector("#focus").onchange=e=>{S.focus=e.target.value;save();render()};
  sh.querySelectorAll("[data-slot]").forEach(x=>x.onchange=()=>{S.slots[+x.dataset.slot]=+x.value;save();render()});
  sh.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{const d=+b.dataset.cd;S.cardioDays=S.cardioDays.includes(d)?S.cardioDays.filter(x=>x!==d):[...S.cardioDays,d];b.classList.toggle("on");save();render()});
  document.getElementById("closeSet").onclick=closeSheet;
  sh.classList.add("show");document.getElementById("scrim").classList.add("show");
}
function closeSheet(){setTab("hoje");document.getElementById("sheet").classList.remove("show");document.getElementById("scrim").classList.remove("show")}
document.getElementById("scrim").onclick=closeSheet;
function setTab(t){document.querySelectorAll(".tab button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t))}
document.querySelectorAll(".tab button").forEach(b=>b.onclick=()=>{
  const t=b.dataset.tab;
  if(t==="hoje"){weekOff=0;selDate=new Date(today);preview=null;render();window.scrollTo({top:0,behavior:"smooth"});setTab("hoje")}
  else if(t==="fichas"){setTab("fichas");document.getElementById("fichas").scrollIntoView({behavior:"smooth"})}
  else if(t==="timer"){startTimer(60)}
  else openSheet();
});
document.getElementById("closeSet")||0;
render();

</script>
</body>
